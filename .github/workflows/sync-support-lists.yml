name: Sync Rayshift support lists

on:
  schedule:
    # Toutes les 6 heures.
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  support:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Rayshift snapshot
        run: node tools/sync-support-lists.mjs

      - name: Commit snapshot when changed
        run: |
          if git diff --quiet -- data/support-lists.json; then
            echo 'Aucune modification dans le snapshot Support Lists.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/support-lists.json
          git commit -m 'chore: update Rayshift support snapshots'
          git push
